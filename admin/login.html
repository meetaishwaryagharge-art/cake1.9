<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login | Varyzon Cake Shop</title>
<link rel="icon" href="../images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <img src="../images/logo.png" alt="Varyzon">
    <h1>Admin Login</h1>
    <p class="sub">Varyzon Cake Shop dashboard</p>
    <form id="lf" novalidate>
      <label for="em">Email</label>
      <input class="form-control" id="em" type="email" autocomplete="username" required placeholder="admin@example.com">
      <label for="pw">Password</label>
      <div class="pw"><input class="form-control" id="pw" type="password" autocomplete="current-password" required placeholder="Your password">
        <button type="button" id="eye" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div>
      <button class="btn btn-choc w-100 mt-4" id="go" type="submit"><span>Sign In</span><span class="spinner-border spinner-border-sm ms-2 d-none" id="sp"></span></button>
      <div class="alert-x d-none" id="err" role="alert"></div>
      <div class="mt-3"><a href="#" id="forgot" class="back" style="margin:0">Forgot password?</a></div>
    </form>
    <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left me-1"></i>Back to website</a>
  </div>
</main>

<script src="../firebase/firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = window.VZ_FIREBASE.config, isConfigured = window.VZ_FIREBASE.configured;

const $ = id => document.getElementById(id);
const err = $("err");
const showErr = (m, warn) => { err.textContent = m; err.className = "alert-x" + (warn ? " alert-w" : ""); };

$("eye").onclick = () => { const p = $("pw"); const s = p.type === "password"; p.type = s ? "text" : "password"; $("eye").innerHTML = '<i class="fa-solid fa-eye' + (s ? "-slash" : "") + '"></i>'; };

if (!isConfigured) {
  showErr("Firebase isn't set up yet. Open firebase/firebase-config.js and paste your project's web-app keys.", true);
  $("go").disabled = true;
} else {
  const auth = getAuth(initializeApp(firebaseConfig));
  onAuthStateChanged(auth, u => { if (u) location.replace("dashboard.html"); });

  const nice = c => ({
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/user-not-found": "No account found for this email.",
    "auth/wrong-password": "Incorrect email or password.",
    "auth/too-many-requests": "Too many attempts. Please wait a few minutes and try again.",
    "auth/network-request-failed": "Network problem. Check your connection."
  })[c] || "Sign-in failed. Please try again.";

  $("lf").addEventListener("submit", async e => {
    e.preventDefault(); err.className = "alert-x d-none";
    if (!$("em").value || !$("pw").value) return showErr("Enter your email and password.");
    $("go").disabled = true; $("sp").classList.remove("d-none");
    try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); location.replace("dashboard.html"); }
    catch (x) { showErr(nice(x.code)); $("go").disabled = false; $("sp").classList.add("d-none"); }
  });

  $("forgot").addEventListener("click", async e => {
    e.preventDefault();
    if (!$("em").value) return showErr("Type your email above first, then click 'Forgot password?'.", true);
    try { await sendPasswordResetEmail(auth, $("em").value.trim()); showErr("Password reset email sent. Check your inbox.", true); }
    catch (x) { showErr(nice(x.code)); }
  });
}
</script>
</body>
</html>
